name: Check Lambda container

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.lambda"
      - ".dockerignore"
      - "backend/**"
      - "storage/**"
      - ".github/workflows/lambda-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Linux x86_64 Lambda image
        run: docker build --platform linux/amd64 -f Dockerfile.lambda -t ai-doc-copilot:lambda-check .

      - name: Report uncompressed image size
        run: docker image inspect ai-doc-copilot:lambda-check --format 'Image size in bytes = {{.Size}}'

      - name: Check installed dependencies
        run: docker run --rm --network none --read-only --tmpfs /tmp ai-doc-copilot:lambda-check python -m pip check

      - name: Check startup using bundled assets
        timeout-minutes: 5
        # The placeholder only constructs Gemini clients. Networking is disabled
        # so this check cannot call Gemini, Jira, or PostgreSQL.
        run: |
          docker run --rm -i --network none --read-only --tmpfs /tmp \
            --memory 2g --cpus 2 \
            -e AWS_LAMBDA_FUNCTION_NAME=lambda-container-check \
            -e GOOGLE_API_KEY=not-a-real-key-for-offline-startup \
            ai-doc-copilot:lambda-check python - <<'PY'
          import asyncio
          import json
          import resource
          import time

          started = time.perf_counter()
          import main
          imported = time.perf_counter()
          asyncio.run(main.startup_event())
          ready = time.perf_counter()
          health = main.health_check()
          print(json.dumps({
              "health": health,
              "import_seconds": round(imported - started, 3),
              "initialization_seconds": round(ready - imported, 3),
              "total_seconds": round(ready - started, 3),
              "peak_process_memory_mib": round(resource.getrusage(resource.RUSAGE_SELF).ru_maxrss / 1024, 1),
          }, indent=2))
          assert health["status"] == "ok", health
          assert health["hexnode_ready"] and health["keka_ready"] and health["combined_ready"], health
          PY
